---
applications:
  - name: steward-agent
    path: target/steward-agent-0.0.1-SNAPSHOT.jar
    memory: 1G
    instances: 1
    buildpacks:
      - java_buildpack
    health-check-type: http
    health-check-http-endpoint: /actuator/health/liveness
    readiness-health-check-type: http
    readiness-health-check-http-endpoint: /actuator/health/readiness
    routes:
      - route: steward-agent.((apps_domain))
      - route: steward-agent.apps.internal
    services:
      # The only thing this application is told about its configuration.
      - golden-config
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
